name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * 1" # mondays 06:00 utc
  workflow_dispatch:
  repository_dispatch:
    types: [input-updated] # client_payload.input names the single input to bump

# one branch/pr per scoped input
concurrency:
  group: update-flake-lock-${{ github.event.client_payload.input || 'all' }}
  cancel-in-progress: true

jobs:
  update-lock:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_FLAKE_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31

      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          # special PAT so the opened PR triggers check.yml
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          pr-title: ${{ github.event.client_payload.input && format('update {0} input', github.event.client_payload.input) || 'update all flake inputs' }}
          pr-labels: dependencies
          # empty for schedule/workflow_dispatch, which updates every input
          inputs: ${{ github.event.client_payload.input }}
          branch: update_flake_lock_${{ github.event.client_payload.input || 'all' }}
          git-author-name: github-actions[bot]
          git-author-email: github-actions[bot]@users.noreply.github.com
          git-committer-name: github-actions[bot]
          git-committer-email: github-actions[bot]@users.noreply.github.com
