name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * 1" # mondays 06:00 utc
  workflow_dispatch:
  repository_dispatch:
    types: [private-input-updated]

jobs:
  update-lock:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_FLAKE_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31

      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          # special PAT so the opened PR triggers check.yml
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          pr-title: ${{ github.event_name == 'repository_dispatch' && 'update nixos-config-private input' || 'update all flake inputs' }}
          pr-labels: dependencies
          inputs: ${{ github.event_name == 'repository_dispatch' && 'nixos-config-private' || '' }}
          git-author-name: github-actions[bot]
          git-author-email: github-actions[bot]@users.noreply.github.com
          git-committer-name: github-actions[bot]
          git-committer-email: github-actions[bot]@users.noreply.github.com
