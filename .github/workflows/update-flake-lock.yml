name: update-flake-lock

on:
  schedule:
    - cron: "22 16 * * 1" # 12:22 edt
  workflow_dispatch:
  repository_dispatch:
    types: [input-updated] # client_payload.input names the single input to bump

# one branch/pr per scoped input
concurrency:
  group: update-flake-lock-${{ github.event.client_payload.input || 'all' }}
  cancel-in-progress: true

jobs:
  update-lock:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_FLAKE_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31

      # use a bot to trigger the pr
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: DeterminateSystems/update-flake-lock@v28
        id: update
        with:
          token: ${{ steps.app-token.outputs.token }}
          # squash-merge titles the commit from the single commit-msg, not pr-title
          commit-msg: ${{ github.event.client_payload.input && format('update {0}', github.event.client_payload.input) || 'update all inputs' }}
          pr-title: ${{ github.event.client_payload.input && format('update {0}', github.event.client_payload.input) || 'update all inputs' }}
          pr-labels: dependencies
          # empty for schedule/workflow_dispatch, which updates every input
          inputs: ${{ github.event.client_payload.input }}
          branch: update_flake_lock_${{ github.event.client_payload.input || 'all' }}
          # the id+slug form is what links the commit to the bot's profile
          git-author-name: erics118-bot[bot]
          git-author-email: 311185523+erics118-bot[bot]@users.noreply.github.com
          git-committer-name: erics118-bot[bot]
          git-committer-email: 311185523+erics118-bot[bot]@users.noreply.github.com

      # automatically merge the pr once checks pass
      - if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ steps.update.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
