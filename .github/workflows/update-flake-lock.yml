name: update-flake-lock

on:
  schedule:
    - cron: "22 16 * * 1" # mondays 12:22 edt
  workflow_dispatch:
  repository_dispatch:
    types: [input-updated] # client_payload.input names the single input to bump

# one branch/pr per scoped input
concurrency:
  group: update-flake-lock-${{ github.event.client_payload.input || 'all' }}
  cancel-in-progress: true

jobs:
  update-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # GITHUB_TOKEN only clones
    # every write uses the app token
    permissions:
      contents: read
    steps:
      # actions are pinned to commit shas, which most repos don't need
      # this job lands lock changes on main, which feeds the cachix cache every host trusts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_FLAKE_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # use a bot to trigger the pr
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # push the branch, open the pr, enable auto-merge
          permission-contents: write
          permission-pull-requests: write

      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        id: update
        with:
          token: ${{ steps.app-token.outputs.token }}
          # squash-merge titles the commit from the single commit-msg, not pr-title
          commit-msg: ${{ github.event.client_payload.input && format('update {0}', github.event.client_payload.input) || 'update all inputs' }}
          pr-title: ${{ github.event.client_payload.input && format('update {0}', github.event.client_payload.input) || 'update all inputs' }}
          pr-labels: dependencies
          # empty for schedule/workflow_dispatch, which updates every input
          inputs: ${{ github.event.client_payload.input }}
          branch: update_flake_lock_${{ github.event.client_payload.input || 'all' }}
          # the id+slug form is what links the commit to the bot's profile
          git-author-name: erics118-bot[bot]
          git-author-email: 311185523+erics118-bot[bot]@users.noreply.github.com
          git-committer-name: erics118-bot[bot]
          git-committer-email: 311185523+erics118-bot[bot]@users.noreply.github.com

      # automatically merge the pr once checks pass
      - if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ steps.update.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
