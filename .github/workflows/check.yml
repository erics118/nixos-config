name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# only the latest run per ref needs to finish
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # the nixos-config-private input is a private git+ssh flake, so we need to set up ssh access for it
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_FLAKE_DEPLOY_KEY }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # push to erics118.cachix.org, pull from the other cachix caches
      - uses: cachix/cachix-action@v17
        with:
          name: erics118
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,numtide,devenv,catppuccin

      - run: nix flake check --print-build-logs
