# the full tab alerts, replacing tabline.conf's bell and activity ones. they need tmux 3.8, so rtmux's remote server goes without

# a command of 10s or more that ends unseen sets @cmd to ok or fail, from zsh's OSC 133 marks (see zsh/init.zsh).
# unseen means a background window, no client attached, or the terminal tab out of focus
set -g @unfocused '#{!:#{m:*focused*,#{client_flags}}}'
set -g @unseen '#{||:#{!=:#{window_active},1},#{||:#{==:#{session_attached},0},#{E:@unfocused}}}'
set-hook -g pane-command-finished {
  if -F '#{&&:#{e|>=:#{pane_command_duration},10},#{E:@unseen}}' {
    set -wF @cmd '#{?#{==:#{pane_command_status},0},ok,fail}'
  }
}
# seeing the window clears it, like tmux's own bell and activity flags
set-hook -g session-window-changed { set -wu @cmd ; set -wu @bell ; set -wu @watch }
set-hook -g client-focus-in { set -wu @cmd ; set -wu @bell ; set -wu @watch }
set-hook -g client-attached { set -wu @cmd ; set -wu @bell ; set -wu @watch }

# activity counts as new output only once the pane gains lines, so a spinner redrawing one line stays unmarked.
# leaving a window, or the terminal tab, saves its line count as @seen.
# history_added keeps counting past history-limit
set -g @lines '#{e|+|:#{history_added},#{cursor_y}}'
# closing one of two windows leaves no last window, so the save is skipped
set-hook -ga session-window-changed { if -F '#{W:#{?window_last_flag,1,}}' { set -wF -t '{last}' @seen '#{E:@lines}' } }
# tmux flags no activity on a window a client shows, so leaving the terminal tab also marks the window @watch.
# new lines in a watched window count as activity for @session-alert below
set-hook -g client-focus-out { set -wF @seen '#{E:@lines}' ; set -w @watch 1 }

# a window's alert, highest priority first: fail, bell, ok, activity, or empty.
# the current window counts as active too while the terminal tab is unfocused, which only the title shows
set -g @new-lines '#{e|>:#{E:@lines},#{@seen}}'
set -g @activity '#{&&:#{||:#{window_activity_flag},#{&&:#{window_active},#{E:@unfocused}}},#{E:@new-lines}}'
set -g @alert '#{?#{==:#{@cmd},fail},fail,\
#{?#{||:#{window_bell_flag},#{@bell}},bell,\
#{?#{==:#{@cmd},ok},ok,\
#{?#{E:@activity},activity,}}}}'

# a session's alert, from its windows: fail, bell, ok, activity, or empty.
# sesh-pick and wezterm's bar.lua colour session names with it like a tab's alert.
# it has no client, so @watch stands in for @activity's active-but-unfocused test
set -g @session-alert '#{?#{W:#{?#{==:#{@cmd},fail},1,}},fail,\
#{?#{W:#{?#{||:#{window_bell_flag},#{@bell}},1,}},bell,\
#{?#{W:#{?#{==:#{@cmd},ok},1,}},ok,\
#{?#{W:#{?#{&&:#{||:#{window_activity_flag},#{@watch}},#{E:@new-lines}},1,}},activity,}}}}'
