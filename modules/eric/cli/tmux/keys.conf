# prefix stays tmux's default C-b, which wezterm's cmd-s sends.
# never move it: tmux on hosts outside this config keeps C-b, and one prefix must work everywhere

# the popups (scratch shell, yazi, sesh picker) are opened, switched, and closed by tmux-popup (see cli/scripts).
# wezterm's cmd-j/e/k/p run it directly for a local tmux, since an open popup takes every key.
# a remote tmux gets keys instead: C-M-j, prefix y, C-M-k, and C-M-p.
# each binding passes the client that pressed it, since run-shell has no client of its own

# each session's scratch shell is a hidden scratch-<session> in a bottom popup.
# tmux.nix (resurrect saves), sesh.nix (picker), and rtmux/_rtmux (completion) filter on the scratch- prefix
unbind t
bind -n C-M-j run-shell 'tmux-popup scratch #{client_tty}'
# scratch sessions get their own tables. C-M-j there detaches, which closes the popup.
# every other wezterm cmd shortcut arrives as C-b plus a key, which scratch-prefix swallows
bind -T scratch C-M-j detach-client
bind -T scratch C-b switch-client -T scratch-prefix
bind -T scratch-prefix Any switch-client -T scratch
# the root table's wheel binding, so scrolling still enters copy mode
bind -T scratch WheelUpPane if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -e }
# a scratch session ends with its parent
set-hook -g session-closed 'run "tmux kill-session -t =scratch-#{q:hook_session_name} 2>/dev/null || true"'

# prefix y opens yazi in a popup at the pane's directory, and quitting yazi closes it
bind y run-shell 'tmux-popup files #{client_tty}'

# yank in copy-mode reaches the system clipboard via OSC 52
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# wezterm sends one wheel event per trackpad tick, so tmux's default 5 lines per event scrolls too far
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# repeatable window switching: hold ctrl, tap prefix then p/n/n/n...
bind -r C-p previous-window
bind -r C-n next-window
# quick toggle to the last window
bind a last-window

# splits on unshifted keys: \ splits side by side, = stacks.
# -c keeps the new pane in the current dir; tmux otherwise uses the shell's
# start dir. same for new windows
bind '\' split-window -h -c "#{pane_current_path}"
bind '=' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# reload without a rebuild, since the confs are symlinks into the repo.
# sources tmux.conf, not main.conf, so the plugins re-run (see main.conf)
bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# toggle this session's status bar, like LEADER Z for the wezterm tab bar
bind Z set status

# number keys skip missing windows instead of flashing an error.
# 0 never exists with base-index 1 and renumber-windows
unbind 0
bind 1 if -F '#{W:#{?#{==:#{window_index},1},1,}}' 'select-window -t :=1'
bind 2 if -F '#{W:#{?#{==:#{window_index},2},1,}}' 'select-window -t :=2'
bind 3 if -F '#{W:#{?#{==:#{window_index},3},1,}}' 'select-window -t :=3'
bind 4 if -F '#{W:#{?#{==:#{window_index},4},1,}}' 'select-window -t :=4'
bind 5 if -F '#{W:#{?#{==:#{window_index},5},1,}}' 'select-window -t :=5'
bind 6 if -F '#{W:#{?#{==:#{window_index},6},1,}}' 'select-window -t :=6'
bind 7 if -F '#{W:#{?#{==:#{window_index},7},1,}}' 'select-window -t :=7'
bind 8 if -F '#{W:#{?#{==:#{window_index},8},1,}}' 'select-window -t :=8'

# 9 picks the last window, like a browser's last tab
bind 9 select-window -t '{end}'

# rotate panes counterclockwise when they were split right then down, repeatable
bind -r r rotate-window -U

# vim-style pane nav, repeatable
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# C-h/j/k/l move between panes and across nvim splits, whose smart-splits.nvim sets @pane-is-vim.
# nvim and fzf get the key itself, so fzf keeps C-j/C-k.
# fzf usually runs in a pipeline, which pane_current_command names after its first command, so ps scans the whole tty
set -g @nav-passthrough "[ '#{@pane-is-vim}' = 1 ] || ps -o state= -o comm= -t '#{pane_tty}' | grep -qE '^[^TXZ ]+ +(.*/)?fzf$'"
bind -n C-h if '#{E:@nav-passthrough}' { send-keys C-h } { select-pane -L }
bind -n C-j if '#{E:@nav-passthrough}' { send-keys C-j } { select-pane -D }
bind -n C-k if '#{E:@nav-passthrough}' { send-keys C-k } { select-pane -U }
bind -n C-l if '#{E:@nav-passthrough}' { send-keys C-l } { select-pane -R }

# resize on shifted hjkl so it doesn't collide with nav
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reorder the current window; -d stays on it instead of following.
# the brackets are copy-mode/paste-buffer by default, so copy-mode moves to
# Enter and paste-buffer to shifted P, out of the way of p for previous-window
bind -r '[' swap-window -d -t -1
bind -r ']' swap-window -d -t +1
bind Enter copy-mode
bind p previous-window
bind P paste-buffer -p

# move the current pane to its own window, staying on this one.
# B joins that pane back as a right split, found by id wherever it went
bind b set -F @broken '#{pane_id}' \; break-pane -d
bind B run -C 'join-pane -h -s #{@broken}'

# default x prompts for confirmation
bind x kill-pane
# like wezterm's close: confirm only when a pane runs something other than a bare shell
bind & if-shell "tmux list-panes -t '#{window_id}' -F '#{pane_current_command}' | grep -qvE '^-?(zsh|bash|sh|fish|nu)\$'" \
  "confirm-before -p 'kill-window #W? (y/n)' kill-window" \
  kill-window

# clicking the tab bar's "+" opens a window. any other click keeps tmux's default
bind -n MouseDown1Status {
  if -F '#{==:#{mouse_status_range},new}' {
    new-window -c "#{pane_current_path}"
  } {
    switch-client -t =
  }
}
# releasing a dragged tab swaps it with the tab under the mouse, staying on the dragged one.
# MouseDrag1Status only sees the tab the drag started on, so the swap waits for the release.
# the press already selected the dragged tab, so it is the active window
unbind -n MouseDrag1Status
bind -n MouseDragEnd1Status run -C 'swap-window -d -s :#{active_window_index} -t :#{window_index} ; select-window -t :#{window_index}'
# scrolling over the tab bar does not switch tabs
unbind -n WheelUpStatus
unbind -n WheelDownStatus

# sesh picker (see sesh.nix) in a popup. s is choose-tree by default.
# S picks only among running sessions.
bind s run-shell 'tmux-popup projects #{client_tty}'
bind S run-shell 'tmux-popup sessions #{client_tty}'
bind -n C-M-p run-shell 'tmux-popup projects #{client_tty}'
bind -n C-M-k run-shell 'tmux-popup sessions #{client_tty}'
