# prefix stays tmux's default C-b, which wezterm's cmd-s sends

# yank in copy-mode reaches the system clipboard via OSC 52
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# repeatable window switching: hold ctrl, tap prefix then p/n/n/n...
bind -r C-p previous-window
bind -r C-n next-window
# quick toggle to the last window
bind a last-window

# splits on unshifted keys: \ splits side by side, = stacks.
# -c keeps the new pane in the current dir; tmux otherwise uses the shell's
# start dir. same for new windows
bind '\' split-window -h -c "#{pane_current_path}"
bind '=' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# reload without a rebuild, since the confs are symlinks into the repo.
# sources tmux.conf, not main.conf, so the plugins re-run and continuum
# re-adds its autosave hook after tabline.conf clears status-right
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# vim-style pane nav, repeatable
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# resize on shifted hjkl so it doesn't collide with nav
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reorder the current window; -d stays on it instead of following.
# the brackets are copy-mode/paste-buffer by default, so copy-mode moves to
# Enter and paste-buffer to shifted P, out of the way of p for previous-window
bind -r '[' swap-window -d -t -1
bind -r ']' swap-window -d -t +1
bind Enter copy-mode
bind p previous-window
bind P paste-buffer -p

# default x prompts for confirmation
bind x kill-pane
# like wezterm's close: confirm only when a pane runs something other than a bare shell
bind & if-shell "tmux list-panes -t '#{window_id}' -F '#{pane_current_command}' | grep -qvE '^-?(zsh|bash|sh|fish|nu)\$'" \
  "confirm-before -p 'kill-window #W? (y/n)' kill-window" \
  kill-window

# clicking the tab bar's "+" opens a window, any other click keeps tmux's default
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},new}' \
  'new-window -c "#{pane_current_path}"' \
  'switch-client -t ='

# sesh picker (see sesh.nix), which opens its own fzf popup. s is choose-tree by default
bind s run-shell sesh-pick
