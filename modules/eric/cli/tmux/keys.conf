# prefix stays tmux's default C-b, which wezterm's cmd-s sends.
# never move it: tmux on hosts outside this config keeps C-b, and one prefix must work everywhere

# prefix t toggles a scratch shell in a bottom popup, replacing the default clock
# each session gets its own hidden scratch-<session>, and prefix t inside it detaches, which closes the popup
# run -C expands #{session_name}, which display-popup leaves literal in its command
bind t if -F '#{m:scratch-*,#{session_name}}' detach-client {
  run -C "display-popup -E -x P -y P -w 100% -h 40% -d '#{pane_current_path}' 'tmux new -A -s scratch-#{session_name} \\; set status off \\; set prefix None \\; set key-table scratch'"
}
# scratch sessions get their own tables, so C-b there reaches only t, which detaches.
# every wezterm cmd shortcut arrives as C-b plus a key, so all of them do nothing there
bind -T scratch C-b switch-client -T scratch-prefix
bind -T scratch-prefix t detach-client
# copy mode reads keys from its own table, so its C-b must also lead to t in scratch.
# elsewhere C-b is the prefix and never reaches copy mode
bind -T copy-mode-vi C-b if -F '#{m:scratch-*,#{session_name}}' { switch-client -T scratch-prefix } { send-keys -X page-up }
# the root table's wheel binding, so scrolling still enters copy mode
bind -T scratch WheelUpPane if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -e }
# a scratch session ends with its parent
set-hook -g session-closed 'run "tmux kill-session -t =scratch-#{hook_session_name} 2>/dev/null || true"'

# yank in copy-mode reaches the system clipboard via OSC 52
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# repeatable window switching: hold ctrl, tap prefix then p/n/n/n...
bind -r C-p previous-window
bind -r C-n next-window
# quick toggle to the last window
bind a last-window

# splits on unshifted keys: \ splits side by side, = stacks.
# -c keeps the new pane in the current dir; tmux otherwise uses the shell's
# start dir. same for new windows
bind '\' split-window -h -c "#{pane_current_path}"
bind '=' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# reload without a rebuild, since the confs are symlinks into the repo.
# sources tmux.conf, not main.conf, so the plugins re-run and continuum
# re-adds its autosave hook after tabline.conf clears status-right
bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# rotate panes counterclockwise when they were split right then down, repeatable
bind -r r rotate-window -U

# vim-style pane nav, repeatable
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# resize on shifted hjkl so it doesn't collide with nav
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reorder the current window; -d stays on it instead of following.
# the brackets are copy-mode/paste-buffer by default, so copy-mode moves to
# Enter and paste-buffer to shifted P, out of the way of p for previous-window
bind -r '[' swap-window -d -t -1
bind -r ']' swap-window -d -t +1
bind Enter copy-mode
bind p previous-window
bind P paste-buffer -p

# default x prompts for confirmation
bind x kill-pane
# like wezterm's close: confirm only when a pane runs something other than a bare shell
bind & if-shell "tmux list-panes -t '#{window_id}' -F '#{pane_current_command}' | grep -qvE '^-?(zsh|bash|sh|fish|nu)\$'" \
  "confirm-before -p 'kill-window #W? (y/n)' kill-window" \
  kill-window

# clicking the tab bar's "+" opens a window, any other click keeps tmux's default
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},new}' \
  'new-window -c "#{pane_current_path}"' \
  'switch-client -t ='
# dragging a tab swaps it with the tab under the mouse, staying on the dragged one
bind -n MouseDrag1Status swap-window -d -t=

# sesh picker (see sesh.nix), which opens its own fzf popup. s is choose-tree by default
bind s run-shell sesh-pick
