# settings every tmux here shares, sourced by main.conf and by rtmux's server on hosts outside this config (see rtmux/remote.conf).
# this file, keys.conf, and tabline.conf use nothing newer than tmux 3.2, since those hosts may run an old tmux

# home-manager's tmux.conf sets "screen" first, which only advertises 8 colors
set -g default-terminal "tmux-256color"
# reset to the built-in list first, since the appends below would stack on every reload
set -su terminal-features
# pass truecolor and OSC 8 links through to programs inside tmux.
# OSC 52 clipboard comes from tmux's built-in xterm* entry.
# mosh before 1.4 garbles truecolor, so every host needs a newer one
set -ag terminal-features ",xterm-256color:RGB:extkeys:hyperlinks"
# a nested tmux sees TERM=tmux-256color. it learns the outer tmux's features from its version reply,
# but a link that never answers that query, as mosh may not, would lose them without this
set -ag terminal-features ",tmux*:RGB:cstyle:extkeys:hyperlinks"

set -g mouse on
set -g history-limit 100000

# start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# vi keys
set -g status-keys vi
set -g mode-keys vi

# let nvim autoread files changed outside tmux
set -g focus-events on
# size a window only by the sessions currently showing it, not every session it
# is linked into
setw -g aggressive-resize on

# keep window numbers gapless when one is closed
set -g renumber-windows on

# show tmux messages long enough to read
set -g display-time 4000

# copy-mode yank reaches the system clipboard via OSC 52
set -g set-clipboard on

# keep the -r repeat window open long enough for comfortable tapping
set -g repeat-time 1000
