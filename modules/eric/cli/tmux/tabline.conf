# tabline mirroring modules/eric/desktop/wezterm/bar.lua
# only the active tab is coloured, always red.
# each tab draws only a right divider -- the active tab's left edge is
# drawn by the preceding tab, which is how bar.lua does it.
# the bar itself is transparent; only tabs get a background
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 20
set -g status-right ""
set -g window-status-separator ""

# leader pill, then a divider bleeding into whatever the first tab is
set -g status-left "#[fg=#1e1e2e]#[bg=#a6e3a1] #{?client_prefix,,} #[fg=#a6e3a1]#{?#{==:#{active_window_index},1},#[bg=#f38ba8],#[bg=#181825]}"

set -g window-status-current-format "#[bg=#f38ba8]#[fg=#1e1e2e] #I: #W#{?#{>:#{window_panes},1}, (#{window_panes}),} #[fg=#f38ba8]#{?#{window_end_flag},#[bg=default],#[bg=#181825]}"

# inactive divider is invisible against its own block, unless the next window
# is the active one -- then it becomes that tab's leading edge
set -g window-status-format "#[bg=#181825]#[fg=#cdd6f4] #I: #W#{?#{>:#{window_panes},1}, (#{window_panes}),} #[fg=#181825]#{?#{==:#{e|+|:#{window_index},1},#{active_window_index}},#[bg=#f38ba8],#{?#{window_end_flag},#[bg=default],#[bg=#181825]}}"
