# tabline with the same layout as modules/eric/desktop/wezterm/bar.lua
# only the active tab's background is coloured, always yellow.
# each tab draws only a right divider -- the active tab's left edge is
# drawn by the preceding tab, which is how bar.lua does it.
# the bar itself is transparent; only tabs get a background
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 20
set -g status-right ""
set -g window-status-separator ""
# tmux 3.8 underlines the current tab by default
set -g window-status-current-style "default"

# leader pill, then a divider bleeding into whatever the first tab is
set -g status-left "#[fg=#1e1e2e]#[bg=#a6e3a1] #{?client_prefix,,} #[fg=#a6e3a1]#{?#{==:#{active_window_index},1},#[bg=#f9e2af],#[bg=#181825]}"

set -g window-status-current-format "#[bg=#f9e2af]#[fg=#1e1e2e] #I: #{=/32/...:window_name}#{?#{>:#{window_panes},1}, (#{window_panes}),} #[fg=#f9e2af]#{?#{window_end_flag},#[bg=default],#[bg=#181825]}"

# a background tab's number turns bold red after a failed command, peach after a bell,
# green after a successful command, or blue after new output, in that order of priority.
# styling takes no space, so tabs keep their width when it clears
# bells come from agents finishing or waiting (see ai/hooks/tmux-bell.sh)
# tmux passes each bell on, so wezterm marks its own tab too (see wezterm/bar.lua)
set -g monitor-activity on
set -g monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g bell-action any
# both default to reverse, which swaps a flagged tab's colours and breaks its dividers
set -g window-status-bell-style default
set -g window-status-activity-style default

# a command of 10s or more that ends unseen sets @cmd to ok or fail, from zsh's OSC 133 marks (see zsh/init.zsh).
# unseen means a background window, no client attached, or the terminal tab out of focus
set-hook -g pane-command-finished {
  if -F '#{&&:#{e|>=:#{pane_command_duration},10},#{||:#{!=:#{window_active},1},#{||:#{==:#{session_attached},0},#{!:#{m:*focused*,#{client_flags}}}}}}' {
    set -wF @cmd '#{?#{==:#{pane_command_status},0},ok,fail}'
  }
}
# seeing the window clears it, like tmux's own bell and activity flags
set-hook -g session-window-changed { set -wu @cmd }
set-hook -g client-focus-in { set -wu @cmd }
set-hook -g client-attached { set -wu @cmd }

# inactive divider is invisible against its own block, unless the next window
# is the active one -- then it becomes that tab's leading edge
set -g window-status-format "#[bg=#181825]#[fg=#cdd6f4] #{?#{==:#{@cmd},fail},#[fg=#f38ba8 bold],#{?window_bell_flag,#[fg=#fab387 bold],#{?#{==:#{@cmd},ok},#[fg=#a6e3a1 bold],#{?window_activity_flag,#[fg=#89b4fa bold],}}}}#I#[fg=#cdd6f4 nobold]: #{=/32/…:window_name}#{?#{>:#{window_panes},1}, (#{window_panes}),} #[fg=#181825]#{?#{==:#{e|+|:#{window_index},1},#{active_window_index}},#[bg=#f9e2af],#{?#{window_end_flag},#[bg=default],#[bg=#181825]}}"
