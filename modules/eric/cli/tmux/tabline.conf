# tabline with the same layout as modules/eric/desktop/wezterm/bar.lua
# the active tab's background is always red, and the others share a dark one.
# each tab draws only a right divider -- the active tab's left edge is
# drawn by the preceding tab, which is how bar.lua does it.
# the bar itself is transparent; only tabs get a background
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-position top
set -g window-status-separator ""

set -g status-right ""
# tmux 3.8 underlines the current tab by default
set -g window-status-current-style "default"

# leader pill, then a divider bleeding into whatever the first tab is
set -g status-left "#[fg=#1e1e2e]#[bg=#a6e3a1] #{?client_prefix,,} #[fg=#a6e3a1]#{?#{==:#{active_window_index},1},#[bg=#f38ba8],#[bg=#181825]}"

# the window name, then the pane count when there is more than one
set -g @pane-count '#{?#{>:#{window_panes},1}, (#{window_panes}),}'
# a tab is at most 50 columns, like max_width in wezterm/bar.lua.
# 44 leaves room for 2 padding spaces, ": ", the divider, and the ellipsis
set -g @tab-name "#{=/#{e|-|:44,#{e|+|:#{w:window_index},#{w:#{E:@pane-count}}}}/\U00002026:window_name}#{E:@pane-count}"
# a tab's right divider takes the colour of what follows: the active tab, what ends the bar, or another tab.
# the bar ends bare unless main.conf adds its "+" button
set -g @end-bg '#[bg=default]'
set -g @divider-bg '#{?#{==:#{e|+|:#{window_index},1},#{active_window_index}},#[bg=#f38ba8],\
#{?window_end_flag,#{E:@end-bg},#[bg=#181825]}}'

set -g window-status-current-format "#[bg=#f38ba8]#[fg=#1e1e2e] #I: #{E:@tab-name} #[fg=#f38ba8]#{E:@divider-bg}"

# a background tab's number turns bold red after a failed command, peach after a bell,
# green after a successful command, or blue after new lines of output, in that order of priority.
# styling takes no space, so tabs keep their width when it clears
# bells come from agents finishing or waiting (see ai/hooks/tmux-bell.sh)
# tmux passes each bell on, so wezterm marks its own tab too (see wezterm/bar.lua)
set -g monitor-activity on
# both default to reverse, which swaps a flagged tab's colours and breaks its dividers
set -g window-status-bell-style default
set -g window-status-activity-style default

# a window's alert: bell, activity, or empty. alerts.conf adds fail and ok on hosts of this config
set -g @alert '#{?window_bell_flag,bell,#{?window_activity_flag,activity,}}'
set -g @alert-style '#{?#{==:#{E:@alert},fail},#[fg=#f38ba8 bold],\
#{?#{==:#{E:@alert},bell},#[fg=#fab387 bold],\
#{?#{==:#{E:@alert},ok},#[fg=#a6e3a1 bold],\
#{?#{==:#{E:@alert},activity},#[fg=#89b4fa bold],}}}}'

# a session's alert, from its windows the same way, which tmux-sessions reports
set -g @session-alert '#{?#{W:#{?window_bell_flag,1,}},bell,#{?#{W:#{?window_activity_flag,1,}},activity,}}'

# inactive divider is invisible against its own block, unless the next window
# is the active one -- then it becomes that tab's leading edge
set -g window-status-format "#[bg=#181825]#[fg=#cdd6f4] #{E:@alert-style}#I#[fg=#cdd6f4 nobold]: #{E:@tab-name} #[fg=#181825]#{E:@divider-bg}"
