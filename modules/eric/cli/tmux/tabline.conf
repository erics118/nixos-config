# tabline with the same layout as modules/eric/desktop/wezterm/bar.lua
# the active tab's background is always red, and the others share a dark one.
# each tab draws only a right divider -- the active tab's left edge is
# drawn by the preceding tab, which is how bar.lua does it.
# the bar itself is transparent; only tabs get a background
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-position top
set -g window-status-separator ""

set -g status-right ""
# tmux 3.8 underlines the current tab by default
set -g window-status-current-style "default"

# leader pill, then a divider bleeding into whatever the first tab is
set -g status-left "#[fg=#1e1e2e]#[bg=#a6e3a1] #{?client_prefix,,} #[fg=#a6e3a1]#{?#{==:#{active_window_index},1},#[bg=#f38ba8],#[bg=#181825]}"

# the window name, then the pane count when there is more than one
set -g @pane-count '#{?#{>:#{window_panes},1}, (#{window_panes}),}'
# a tab is at most 50 columns, like max_width in wezterm/bar.lua.
# 44 leaves room for 2 padding spaces, ": ", the divider, and the ellipsis
set -g @tab-name "#{=/#{e|-|:44,#{e|+|:#{w:window_index},#{w:#{E:@pane-count}}}}/\U00002026:window_name}#{E:@pane-count}"
# a tab's right divider takes the colour of what follows: the active tab, the "+" button, or another tab
set -g @divider-bg '#{?#{==:#{e|+|:#{window_index},1},#{active_window_index}},#[bg=#f38ba8],\
#{?window_end_flag,#[bg=#313244],#[bg=#181825]}}'

set -g window-status-current-format "#[bg=#f38ba8]#[fg=#1e1e2e] #I: #{E:@tab-name} #[fg=#f38ba8]#{E:@divider-bg}"

# a background tab's number turns bold red after a failed command, peach after a bell,
# green after a successful command, or blue after new lines of output, in that order of priority.
# styling takes no space, so tabs keep their width when it clears
# bells come from agents finishing or waiting (see ai/hooks/tmux-bell.sh)
# tmux passes each bell on, so wezterm marks its own tab too (see wezterm/bar.lua)
set -g monitor-activity on
# both default to reverse, which swaps a flagged tab's colours and breaks its dividers
set -g window-status-bell-style default
set -g window-status-activity-style default

# a command of 10s or more that ends unseen sets @cmd to ok or fail, from zsh's OSC 133 marks (see zsh/init.zsh).
# unseen means a background window, no client attached, or the terminal tab out of focus
set -g @unfocused '#{!:#{m:*focused*,#{client_flags}}}'
set -g @unseen '#{||:#{!=:#{window_active},1},#{||:#{==:#{session_attached},0},#{E:@unfocused}}}'
set-hook -g pane-command-finished {
  if -F '#{&&:#{e|>=:#{pane_command_duration},10},#{E:@unseen}}' {
    set -wF @cmd '#{?#{==:#{pane_command_status},0},ok,fail}'
  }
}
# seeing the window clears it, like tmux's own bell and activity flags
set-hook -g session-window-changed { set -wu @cmd ; set -wu @bell ; set -wu @watch }
set-hook -g client-focus-in { set -wu @cmd ; set -wu @bell ; set -wu @watch }
set-hook -g client-attached { set -wu @cmd ; set -wu @bell ; set -wu @watch }

# activity counts as new output only once the pane gains lines, so a spinner redrawing one line stays unmarked.
# leaving a window, or the terminal tab, saves its line count as @seen.
# history_added keeps counting past history-limit
set -g @lines '#{e|+|:#{history_added},#{cursor_y}}'
# closing one of two windows leaves no last window, so the save is skipped
set-hook -ga session-window-changed { if -F '#{W:#{?window_last_flag,1,}}' { set -wF -t '{last}' @seen '#{E:@lines}' } }
# tmux flags no activity on a window a client shows, so leaving the terminal tab also marks the window @watch.
# new lines in a watched window count as activity for @session-alert below
set-hook -g client-focus-out { set -wF @seen '#{E:@lines}' ; set -w @watch 1 }

# a window's alert, highest priority first: fail, bell, ok, activity, or empty.
# the current window counts as active too while the terminal tab is unfocused, which only the title shows
set -g @new-lines '#{e|>:#{E:@lines},#{@seen}}'
set -g @activity '#{&&:#{||:#{window_activity_flag},#{&&:#{window_active},#{E:@unfocused}}},#{E:@new-lines}}'
set -g @alert '#{?#{==:#{@cmd},fail},fail,\
#{?#{||:#{window_bell_flag},#{@bell}},bell,\
#{?#{==:#{@cmd},ok},ok,\
#{?#{E:@activity},activity,}}}}'
set -g @alert-style '#{?#{==:#{E:@alert},fail},#[fg=#f38ba8 bold],\
#{?#{==:#{E:@alert},bell},#[fg=#fab387 bold],\
#{?#{==:#{E:@alert},ok},#[fg=#a6e3a1 bold],\
#{?#{==:#{E:@alert},activity},#[fg=#89b4fa bold],}}}}'

# a session's alert, from its windows: fail, bell, ok, activity, or empty.
# sesh-pick and wezterm's bar.lua colour session names with it like a tab's alert.
# it has no client, so @watch stands in for @activity's active-but-unfocused test
set -g @session-alert '#{?#{W:#{?#{==:#{@cmd},fail},1,}},fail,\
#{?#{W:#{?#{||:#{window_bell_flag},#{@bell}},1,}},bell,\
#{?#{W:#{?#{==:#{@cmd},ok},1,}},ok,\
#{?#{W:#{?#{&&:#{||:#{window_activity_flag},#{@watch}},#{E:@new-lines}},1,}},activity,}}}}'

# inactive divider is invisible against its own block, unless the next window
# is the active one -- then it becomes that tab's leading edge
set -g window-status-format "#[bg=#181825]#[fg=#cdd6f4] #{E:@alert-style}#I#[fg=#cdd6f4 nobold]: #{E:@tab-name} #[fg=#181825]#{E:@divider-bg}"
