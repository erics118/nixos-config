# the popups (scratch shell, yazi, sesh picker) are opened, switched, and closed by tmux-popup (see cli/scripts).
# wezterm's cmd-j/e/p run it directly for a local tmux, since an open popup takes every key.
# a remote tmux gets keys instead: C-M-j, C-M-y, and C-M-p.
# each binding passes the client that pressed it, since run-shell has no client of its own

# each session's scratch shell is a session of the same name on the scratch server (-L scratch, see scratch.conf), in a bottom popup.
# no session list, picker, or resurrect save sees it, since they all read this server
unbind t
bind -n C-M-j run-shell 'tmux-popup scratch #{client_tty}'
# C-M-y/p in a scratch shell swap the popup for another through the outer client and its server, which tmux-popup stores in @popup-client and @main-socket
bind -T scratch C-M-y run-shell 'TMUX=#{@main-socket} tmux-popup files #{@popup-client}'
bind -T scratch C-M-p run-shell 'TMUX=#{@main-socket} tmux-popup projects #{@popup-client}'
# a scratch session ends with its parent
set-hook -g session-closed 'run "tmux -L scratch kill-session -t =#{q:hook_session_name} 2>/dev/null || true"'
# a rename leaves the old scratch session without a parent, and the hook does not name the old session
set-hook -g session-renamed 'run "tmux -L scratch ls -F \"##{session_name}\" 2>/dev/null | while IFS= read -r s; do tmux has -t \"=\$s\" 2>/dev/null || tmux -L scratch kill-session -t \"=\$s\"; done"'

# prefix y opens yazi in a popup at the pane's directory, and quitting yazi closes it
bind y run-shell 'tmux-popup files #{client_tty}'
bind -n C-M-y run-shell 'tmux-popup files #{client_tty}'

# sesh picker (see sesh.nix) in a popup. s is choose-tree by default.
# S picks only among running sessions.
bind s run-shell 'tmux-popup projects #{client_tty}'
bind S run-shell 'tmux-popup sessions #{client_tty}'
bind -n C-M-p run-shell 'tmux-popup projects #{client_tty}'
