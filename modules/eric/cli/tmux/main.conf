# default is "screen", which only advertises 8 colors
set -g default-terminal "tmux-256color"
# pass truecolor and OSC 52 clipboard through to programs inside tmux;
# terminfo here lacks the Ms cap, so assert clipboard support explicitly
set -ag terminal-features ",xterm-256color:RGB:clipboard:extkeys"
# nesting via ssh forwards TERM=tmux-256color, which matches no built-in
# feature entry, so extended keys are lost without this
set -ag terminal-features ",tmux*:RGB:cstyle:extkeys"

# forward CSI-u sequences so programs can distinguish <C-1>, <C-S-x>, etc
set -s extended-keys always

# claude code caps itself at 256 colors under tmux and quantizes the
# statusline's truecolor escapes; this opts back into 24-bit
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# match wezterm's SteadyBar; "default" emits terminfo Se (\e[2 q) = block
set -g cursor-style bar

set -g mouse on
set -g history-limit 100000

# start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# vi keys
set -g status-keys vi
set -g mode-keys vi

# let nvim autoread files changed outside tmux
set -g focus-events on
# size windows to the largest client viewing them, not the smallest attached
setw -g aggressive-resize on
# with several clients attached, size to the most recently active one so a
# stale client left by a dropped link cannot clamp the window
set -g window-size latest

# keep window numbers gapless when one is closed
set -g renumber-windows on

# name a window after whatever the program in it reports; the shell hooks keep
# that current for a bare prompt
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_title}'

# tmux composes the outer terminal's title itself rather than forwarding #T,
# so a program that renames its pane cannot rename the wezterm tab
set -g set-titles on
if-shell '[ -n "$SSH_CONNECTION" ]' \
  "set -g set-titles-string '#{host_short}: #{s,^/(home|Users)/[^/]+,~,:pane_current_path} - #{pane_current_command}'" \
  "set -g set-titles-string '#{s,^/(home|Users)/[^/]+,~,:pane_current_path} - #{pane_current_command}'"

# show tmux messages long enough to read
set -g display-time 4000

# copy-mode yank reaches the system clipboard via OSC 52
set -g set-clipboard on

# keep the -r repeat window open long enough for comfortable tapping
set -g repeat-time 1000

source-file -q ~/.config/tmux/keys.conf
source-file -q ~/.config/tmux/tabline.conf
