# default is "screen", which only advertises 8 colors
set -g default-terminal "tmux-256color"
# reset to the built-in list first, since the appends below would stack on every reload
set -su terminal-features
# pass truecolor and OSC 8 links through to programs inside tmux.
# OSC 52 clipboard comes from tmux's built-in xterm* entry
set -ag terminal-features ",xterm-256color:RGB:extkeys:hyperlinks"
# nesting via ssh forwards TERM=tmux-256color, which matches no built-in
# feature entry, so extended keys are lost without this
set -ag terminal-features ",tmux*:RGB:cstyle:extkeys:hyperlinks"

# let yazi's image previews reach wezterm, which needs TERM and TERM_PROGRAM to detect it
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# shade unfocused panes by dimming every colour, including ones programs set (tmux 3.8)
set -g window-style 'fg=#cdd6f4,bg=#1e1e2e,dim=30%'
# the active pane falls back to window-style for any colour it leaves default, so set both
set -g window-active-style 'fg=#cdd6f4,bg=#1e1e2e'

# wezterm's catppuccin mocha ansi colours, so dim darkens these instead of tmux's xterm defaults
set -g pane-colours[0] '#45475a'
set -g pane-colours[1] '#f38ba8'
set -g pane-colours[2] '#a6e3a1'
set -g pane-colours[3] '#f9e2af'
set -g pane-colours[4] '#89b4fa'
set -g pane-colours[5] '#f5c2e7'
set -g pane-colours[6] '#94e2d5'
set -g pane-colours[7] '#bac2de'
set -g pane-colours[8] '#585b70'
set -g pane-colours[9] '#f38ba8'
set -g pane-colours[10] '#a6e3a1'
set -g pane-colours[11] '#f9e2af'
set -g pane-colours[12] '#89b4fa'
set -g pane-colours[13] '#f5c2e7'
set -g pane-colours[14] '#94e2d5'
set -g pane-colours[15] '#a6adc8'

# tmux 3.8 draws messages, menus, popups, and copy mode in theme colours, so map them to catppuccin mocha
set -g dark-theme-black '#1e1e2e'
set -g dark-theme-white '#cdd6f4'
set -g dark-theme-light-grey '#a6adc8'
set -g dark-theme-dark-grey '#313244'
set -g dark-theme-green '#a6e3a1'
set -g dark-theme-yellow '#f9e2af'
set -g dark-theme-red '#f38ba8'
set -g dark-theme-blue '#89b4fa'
set -g dark-theme-cyan '#94e2d5'
set -g dark-theme-magenta '#f5c2e7'
# tmux 3.8 gives popups a grey background and marks unused space with ~.
# keep both plain, with a dim popup border
set -g popup-style default
set -g popup-border-style 'fg=#6c7086'
set -g fill-character ''

# forward CSI-u sequences so programs can distinguish <C-1>, <C-S-x>, etc
set -s extended-keys always
set -g extended-keys-format csi-u

# new panes re-load home-manager's session vars, so a switch reaches them without
# restarting the server
set-environment -gu __HM_SESS_VARS_SOURCED

# claude code caps itself at 256 colors under tmux and quantizes the
# statusline's truecolor escapes; this opts back into 24-bit
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# match wezterm's SteadyBar; "default" emits terminfo Se (\e[2 q) = block
set -g cursor-style bar

set -g mouse on
set -g history-limit 100000

# start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# vi keys
set -g status-keys vi
set -g mode-keys vi

# let nvim autoread files changed outside tmux
set -g focus-events on
# size a window only by the sessions currently showing it, not every session it
# is linked into
setw -g aggressive-resize on
# with several clients attached, size to the most recently active one so a
# stale client left by a dropped link cannot clamp the window
set -g window-size latest

# keep window numbers gapless when one is closed
set -g renumber-windows on

# name a window after whatever the program in it reports; the shell hooks keep
# that current for a bare prompt
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_title}'

# tmux composes the outer terminal's title itself rather than forwarding #T,
# so a program that renames its pane cannot rename the wezterm tab
set -g set-titles on
# a leading ✗ (a command failed), ‼ (a window rang the bell), ✓ (a command succeeded),
# or • (a window has new output) lets wezterm colour its tab to match the tabline,
# and wezterm/bar.lua strips it from the title. @cmd is set in tabline.conf
if-shell '[ -n "$SSH_CONNECTION" ]' \
  "set -g set-titles-string '#{?#{m:*fail*,#{W:#{@cmd} }},✗ ,#{?#{m:*!*,#{session_alerts}},‼ ,#{?#{m:*ok*,#{W:#{@cmd} }},✓ ,#{?session_alerts,• ,}}}}#{host_short}: #{session_name} - #{pane_current_command}'" \
  "set -g set-titles-string '#{?#{m:*fail*,#{W:#{@cmd} }},✗ ,#{?#{m:*!*,#{session_alerts}},‼ ,#{?#{m:*ok*,#{W:#{@cmd} }},✓ ,#{?session_alerts,• ,}}}}#{session_name} - #{pane_current_command}'"

# show tmux messages long enough to read
set -g display-time 4000

# copy-mode yank reaches the system clipboard via OSC 52
set -g set-clipboard on

# keep the -r repeat window open long enough for comfortable tapping
set -g repeat-time 1000

# resurrect/continuum session persistence. the plugins are run-shell'd from
# tmux.nix after this file is sourced, so continuum's autosave hook (prepended
# to status-right) survives tabline.conf clearing status-right. these @options
# must be set before the plugins load, so they live here
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
# the nix neovim wrapper execs nvim by store path, which the default "nvim" entry
# never matches. no "*" to keep file args: resurrect splices them in with sed,
# which breaks on any "/" and then restores nothing
set -g @resurrect-processes '"~bin/nvim->nvim"'
# claude, codex, and pi panes come back running their exact session
set -g @resurrect-hook-post-save-all '"$HOME/.config/tmux/agent-resume.sh" save'
set -g @resurrect-hook-post-restore-all '"$HOME/.config/tmux/agent-resume.sh" restore'

source-file -q ~/.config/tmux/keys.conf
source-file -q ~/.config/tmux/tabline.conf

# a "+" after the last tab, like wezterm's new-tab button. keys.conf opens a
# window on click. appended here, after tabline.conf sets both formats
set -ga window-status-current-format "#{?window_end_flag,#[range=user|new]#[fg=#313244]#[bg=default] + #[norange],}"
set -ga window-status-format "#{?window_end_flag,#[range=user|new]#[fg=#313244]#[bg=default] + #[norange],}"
