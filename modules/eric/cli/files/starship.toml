'$schema' = 'https://starship.rs/config-schema.json'

### MAIN SHELL
# directory | username@hostname | git | cmd duration | direnv ---- time
# os ▶

format = """
${custom.top}\
$directory\
[┤](fg:surface1)\
$username\
$hostname\
[├](fg:surface1)\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$cmd_duration\
$direnv\
$fill\
\
$time\
\
$line_break\
$shell\
${custom.bottom}\
$os\
$character"""

scan_timeout = 30
command_timeout = 200
add_newline = true

follow_symlinks = false

[directory.substitutions]
'.config' = ' '
'nixos-config' = ' '
'dev' = ' '
'Desktop' = ' '
'Documents' = ' '
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[shell]
disabled = true
bash_indicator = "bash"
fish_indicator = "fish"
zsh_indicator = "zsh"
powershell_indicator = "pwsh"
cmd_indicator = "cmd"

[custom.top]
symbol = "┌┤"
format = '[$symbol]($style)'
style = "surface1"
when = true

[custom.bottom]
symbol = "└"
format = '[$symbol]($style)'
style = "surface1"
when = true

[character]
success_symbol = '[▶](bold teal)'
error_symbol = '[▶](bold red)'
vimcmd_symbol = '[▷](bold teal)'

[os]
disabled = false
format = '[┤](fg:surface1)[$symbol]($style)'
style = 'fg:green'

[os.symbols]
Macos = ' '
Linux = ' '
Windows = ' '
NixOS = ' '
Ubuntu = ' '
Arch = ' '
Debian = ' '
Fedora = ' '

[directory]
format = "[$path]($style)[$read_only]($read_only_style)[├](fg:surface1)"
style = 'fg:teal'
read_only = ''
use_os_path_sep = false
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"

[username]
show_always = true
format = '[$user]($style)'
style_user = 'fg:yellow'
style_root = 'fg:red'

[hostname]
ssh_only = true
format = '[@$hostname]($style)'
style = 'fg:yellow'
trim_at = '.'

[sudo]
disabled = true
format = '[┤](fg:surface1)[$symbol]($style)[├](fg:surface1)'
style = 'fg:red'
symbol = ' '

[shlvl]
disabled = true
format = "[$symbol]($style) "
threshold = 2
symbol = "*"
repeat = true

[direnv]
disabled = false
format = '[┤](fg:surface1)[$symbol$allowed$loaded]($style)[├](fg:surface1)'
symbol = ' '
allowed_msg = ''
not_allowed_msg = '?'
denied_msg = '×'
loaded_msg = '✓'
unloaded_msg = '-'

[git_metrics]
disabled = true
format = '[┤](fg:surface1)[+$added](fg:green)/[-$deleted](fg:red)[├](fg:surface1)'
added_style = 'fg:green'
deleted_style = 'fg:red'

[git_branch]
symbol = ' '
format = '[┤](fg:surface1)[$symbol$branch]($style)[├](fg:surface1)'
style = 'fg:pink'

[git_status]
format = '([┤](fg:surface1)[$all_status$ahead_behind]($style)[├](fg:surface1))'
ahead = "↑"
behind = "↓"
conflicted = "!"
deleted = "×"
diverged = "↕"
modified = "~"
renamed = "»"
untracked = "+"
style = 'fg:pink'

[cmd_duration]
format = '[┤](fg:surface1)[󰚭 $duration]($style)[├](fg:surface1)'
min_time = 0
show_milliseconds = true

[fill]
symbol = '─'
style = 'fg:surface1'

[time]
disabled = false
format = '[┤](fg:surface1)[ $time]($style)[├](fg:surface1)'

