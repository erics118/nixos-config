### CONTEXT INDICATORS
[aws]
symbol = ' '
format = '[┤](fg:surface1)[$symbol($profile)(\($region\))(\[$duration\])]($style)[├](fg:surface1)'

[docker_context]
symbol = ' '
format = '[┤](fg:surface1)[$symbol$context]($style)[├](fg:surface1)'

[gcloud]
symbol = ' '
format = '[┤](fg:surface1)[$symbol$account(@$domain)(\($region\))]($style)[├](fg:surface1)'

[kubernetes]
symbol = ' '
format = '[┤](fg:surface1)[$symbol($cluster/$namespace)]($style)[├](fg:surface1)'
disabled = false

[openstack]
symbol = ' '
format = '[┤](fg:surface1)[$symbol$cloud(\($project\))]($style)[├](fg:surface1)'

[terraform]
format = '[┤](fg:surface1)[$symbol$workspace]($style)[├](fg:surface1)'
