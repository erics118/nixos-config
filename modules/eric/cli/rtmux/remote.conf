# rtmux's private tmux server on hosts outside this config (see rtmux.sh)
# it uses no option newer than tmux 3.2, since those hosts may run an old tmux
set -g default-terminal tmux-256color
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 100000
set -g mode-keys vi
set -g monitor-activity on

# wezterm's cmd-j/e/p reach a remote tmux as these keys (see tmux/keys.conf), and this host has no popups for them.
# binding them keeps the raw escape bytes out of the program
bind -n C-M-j display 'no scratch popup on this host'
bind -n C-M-y display 'no file popup on this host'
bind -n C-M-p display 'no project picker on this host'

# a session's alert, bell or activity, which tmux-sessions reports (see tmux/tabline.conf for the full set)
set -g @session-alert '#{?#{W:#{?window_bell_flag,1,}},bell,#{?#{W:#{?window_activity_flag,1,}},activity,}}'

# the title main.conf sets: an alert marker, then host:session: window, which wezterm/bar.lua reads.
# @host is the name rtmux reached the session's host by, set on the session at each attach
set -g set-titles on
set -g set-titles-string '#{?#{==:#{E:@session-alert},bell},‼ ,#{?#{==:#{E:@session-alert},activity},• ,}}#{?@host,#{@host},#{host_short}}:#{session_name}: #{window_name}'
