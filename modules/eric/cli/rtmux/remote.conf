# rtmux's private tmux server on hosts outside this config (see rtmux.sh)
# it uses no option newer than tmux 3.2, since those hosts may run an old tmux.
# rtmux installs the shared confs beside it (see rtmux.nix)
source-file -F '#{d:current_file}/base.conf'
source-file -F '#{d:current_file}/keys.conf'
source-file -F '#{d:current_file}/tabline.conf'

# wezterm's cmd-j/e/p reach a remote tmux as these keys (see tmux/popups.conf), and this host has no tmux-popup for them.
# C-M-j opens this session's scratch shell, a session of the same name on its own server, in a bottom popup.
# that server takes this file's keys, and C-M-j there detaches, which closes the popup (see tmux/keys.conf).
# run-shell fills in the session name, since tmux 3.2 expands no formats in a popup's command
bind -n C-M-j run-shell 'tmux display-popup -c "#{client_tty}" -E -x 0 -y "##{client_height}" -w 100% -h 40% -d "#{pane_current_path}" \
  "TMUX= tmux -u -L erics118-scratch -f \"\$HOME/.local/erics118/tmux.conf\" new -A -s #{q:session_name} \\; set status off \\; set prefix None \\; set key-table scratch"'
set-hook -g session-closed 'run "tmux -L erics118-scratch kill-session -t =#{q:hook_session_name} 2>/dev/null || true"'
# C-M-y opens yazi when the host has it. binding the rest keeps the raw escape bytes out of the program
bind -n C-M-y if-shell 'command -v yazi' { display-popup -E -w 90% -h 90% -d '#{pane_current_path}' yazi } { display 'no yazi on this host' }
bind -n C-M-p display 'no project picker on this host'
bind -T scratch C-M-y display 'no popup switching on this host'
bind -T scratch C-M-p display 'no popup switching on this host'

# the title main.conf sets: an alert marker, then host:session: window, which wezterm/bar.lua reads.
# @host is the name rtmux reached the session's host by, set on the session at each attach
set -g set-titles on
set -g set-titles-string '#{?#{==:#{E:@session-alert},bell},‼ ,#{?#{==:#{E:@session-alert},activity},• ,}}#{?@host,#{@host},#{host_short}}:#{session_name}: #{window_name}'
