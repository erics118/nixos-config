# Catppuccin Mocha
$base   = rgba(1e1e2eff)
$mantle = rgba(181825ff)
$text   = rgba(cdd6f4ff)
$mauve  = rgba(cba6f7ff)
$red    = rgba(f38ba8ff)

background {
    monitor =
    path = ~/Pictures/wallpapers/current.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 90
    font_family = Hack Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text
    font_size = 22
    font_family = Hack Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $text
    font_size = 16
    font_family = Hack Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $mauve
    inner_color = $mantle
    font_color = $text
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}
