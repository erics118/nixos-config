general {
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # wake displays after resume
}

# No lock screen: a lock covers every output, which would lock agents out of the agent output

# Turn off the physical display after 5 min
# hyprland.lua's lua config takes lua dispatch calls, and naming the monitor spares the agent output
listener {
    timeout    = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off", monitor = "HDMI-A-1" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on", monitor = "HDMI-A-1" })'
}
