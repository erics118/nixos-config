general {
    lock_cmd       = pidof hyprlock || hyprlock   # avoid duplicate hyprlock instances
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on    # wake displays after resume
}

# Lock after 5 min
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# Turn off displays 30s after lock
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
